<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>యువగళం ఈ-పేపర్ - Yuvagalam E-Paper</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            padding: 20px;
            background-color: #f4f4f9;

        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);

            position: relative;

            max-width: 100%;

        }

            padding: 10px 20px;

            border: none;

        }

            background-color: #2c5282;
        }

            background-color: #38a169;

            background-color: #276749;
        }

            display: none;
            margin: 20px auto;

        }
    </style>

<body>

    <header>
        <h1>యువగళం ఈ-పేపర్ (Yuvagalam E-Paper)</h1>
    </header>

    <div class="container">
        <div class="controls">
            <input type="file" id="upload-paper" accept="image/*">
            <button id="crop-btn" onclick="downloadCroppedNews()">క్రాప్ చేసి లోగోతో డౌన్‌లోడ్ చేయండి</button>
        </div>

        <div id="paper-container">
            <img id="epaper-image" src="logo.png.jpg" alt="యువగళం ఈ-పేపర్">
        </div>

        <canvas id="crop-canvas"></canvas>
    </div>

    <script>
        const uploadInput = document.getElementById('upload-paper');
        const epaperImage = document.getElementById('epaper-image');
        const canvas = document.getElementById('crop-canvas');
        const ctx = canvas.getContext('2d');

        // ఇమేజ్ అప్‌లోడ్ చేసినప్పుడు డిస్‌ప్లే చేయడం
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    epaperImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // వార్తను క్రాప్ చేసి పైన 'యువగళం' లోగో అమర్చి డౌన్‌లోడ్ చేసే ఫంక్షన్
        function downloadCroppedNews() {
            const logo = new Image();
            logo.crossOrigin = "Anonymous";
            logo.src = 'logo.png.jpg'; // మీ లోగో ఫైల్ నేమ్

            logo.onload = function() {
                // క్యాన్వాస్ సైజ్ సెట్ చేయడం
                const imgWidth = epaperImage.naturalWidth || epaperImage.width;
                const imgHeight = epaperImage.naturalHeight || epaperImage.height;

                const headerHeight = 120; // లోగో కోసం పైన కేటాయించే స్థలం
                canvas.width = imgWidth;
                canvas.height = imgHeight + headerHeight;

                // 1. వైట్ బ్యాక్‌గ్రౌండ్ డ్రా చేయడం
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 2. పైన యువగళం లోగో అమర్చడం (Center alignment)
                const logoWidth = Math.min(canvas.width * 0.7, 400);
                const logoHeight = (logo.height / logo.width) * logoWidth;
                const logoX = (canvas.width - logoWidth) / 2;
                
                ctx.drawImage(logo, logoX, 15, logoWidth, logoHeight);

                // 3. క్రాప్ చేసిన లేదా సెలెక్ట్ చేసిన ఈ-పేపర్ వార్తను లోగో కింద డ్రా చేయడం
                ctx.drawImage(epaperImage, 0, headerHeight, imgWidth, imgHeight);

                // 4. ఇమేజ్ ని డౌన్‌లోడ్ చేయడం
                const link = document.createElement('a');
                link.download = 'Yuvagalam-News-Crop.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
        }
    </script>
