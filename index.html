<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>యువగళం ఈ-పేపర్ - Yuvagalam E-Paper</title>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 0; }
        header { background: #d32f2f; padding: 12px; }
        header img { height: 60px; }
        .controls { margin: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
        button, input { padding: 8px 15px; font-size: 15px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
        #canvas-container { position: relative; display: inline-block; margin: 10px auto; max-width: 95%; overflow: auto; }
        canvas { border: 1px solid #ddd; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <header>
        <img src="logo.png.jpg" alt="యువగళం లోగో" id="header-logo">
    </header>

    <div class="controls">
        <input type="file" id="pdf-upload" accept="application/pdf">
        <button id="prev-page">గత పేజీ</button>
        <span>పేజీ: <span id="page-num">0</span> / <span id="page-count">0</span></span>
        <button id="next-page">తర్వాతి పేజీ</button>
        <button id="crop-download-btn" style="background: #28a745; color: white; font-weight: bold;">వార్తను లోగోతో డౌన్‌లోడ్ చేయండి</button>
    </div>

    <div id="canvas-container">
        <canvas id="pdf-canvas"></canvas>
    </div>

    <script>
        let pdfDoc = null, pageNum = 1, scale = 1.5;
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        // PDF ఓపెన్ చేయడం
        document.getElementById('pdf-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type === "application/pdf") {
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                        pdfDoc = pdf;
                        document.getElementById('page-count').textContent = pdf.numPages;
                        pageNum = 1;
                        renderPage(pageNum);
                    });
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        function renderPage(num) {
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                const renderContext = { canvasContext: ctx, viewport: viewport };
                page.render(renderContext);
                document.getElementById('page-num').textContent = num;
            });
        }

        document.getElementById('prev-page').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            renderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            renderPage(pageNum);
        });

        // వార్తా ఇమేజ్ పైన "యువగళం" లోగో జోడించి డౌన్‌లోడ్ చేయడం
        document.getElementById('crop-download-btn').addEventListener('click', function() {
            if (!pdfDoc) {
                alert("దయచేసి ముందుగా పత్రిక PDF ఫైల్‌ని ఎంచుకోండి!");
                return;
            }

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            const logo = new Image();
            logo.crossOrigin = "Anonymous";
            logo.src = 'logo.png.jpg'; // మీ లోగో అడ్రస్

            logo.onload = function() {
                const logoHeaderHeight = 110; 
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height + logoHeaderHeight;

                // వైట్ బ్యాక్‌గ్రౌండ్
                tempCtx.fillStyle = "#ffffff";
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                // పైన యువగళం లోగో అమర్చడం
                const logoWidth = Math.min(tempCanvas.width * 0.6, 350);
                const logoHeight = (logo.height / logo.width) * logoWidth;
                const logoX = (tempCanvas.width - logoWidth) / 2;
                tempCtx.drawImage(logo, logoX, 10, logoWidth, logoHeight);

                // లోగో కింద వార్తా పేజీ డ్రా చేయడం
                tempCtx.drawImage(canvas, 0, logoHeaderHeight);

                // ఇమేజ్ డౌన్‌లోడ్
                const link = document.createElement('a');
                link.download = 'Yuvagalam-News-Page.png';
                link.href = tempCanvas.toDataURL('image/png');
                link.click();
            };

            logo.onerror = function() {
                alert("యువగళం లోగో (`logo.png.jpg`) దొరకలేదు. ఫైల్ నేమ్ చెక్ చేయండి.");
            };
        });
    </script>
</body>
</html>
