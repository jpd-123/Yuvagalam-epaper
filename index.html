<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>యువగళం ఈ-పేపర్</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; text-align: center; margin: 0; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 450px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #cc0000; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        #viewer-section { display: none; }
        .header-bar { background: #fff; padding: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: center; gap: 10px; }
        .btn-action { padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-crop { background: #007bff; color: white; }
        .btn-download { background: #28a745; color: white; }
        .btn-wa { background: #25D366; color: white; }
        canvas { max-width: 100%; height: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.2); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="card" id="upload-card">
        <h2 style="color:#cc0000;">యువగళం ఈ-పేపర్ అప్‌లోడ్</h2>
        <input type="file" id="pdf-file" accept="application/pdf" style="width:100%; margin-bottom:10px;">
        <button class="btn" onclick="uploadAndLoadPDF()">ఈ-పేపర్ లోడ్ చేయండి</button>
        <p id="status-text" style="color: blue; display: none;">ఫైల్ అప్‌లోడ్ అవుతోంది... దయచేసి వేచి ఉండండి.</p>
    </div>

    <div id="viewer-section">
        <div class="header-bar">
            <button class="btn-action btn-download" onclick="downloadCropped()">📥 డౌన్‌లోడ్</button>
            <button class="btn-action btn-wa" onclick="shareWhatsApp()">💬 WhatsApp లో షేర్ చేయండి</button>
        </div>
        <div id="pages-container"></div>
    </div>

    <script>
        let currentPdfUrl = "";

        // Check URL on Load for shared links
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pdfParam = urlParams.get('pdf');
            if (pdfParam) {
                document.getElementById('upload-card').style.display = 'none';
                document.getElementById('viewer-section').style.display = 'block';
                renderPDF(pdfParam);
            }
        });

        async function uploadAndLoadPDF() {
            const fileInput = document.getElementById('pdf-file');
            if (fileInput.files.length === 0) {
                alert("దయచేసి PDF ఫైల్‌ను ఎంచుకోండి");
                return;
            }

            const statusText = document.getElementById('status-text');
            statusText.style.display = 'block';

            const formData = new FormData();
            formData.append('pdf', fileInput.files[0]);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    currentPdfUrl = data.url;
                    // Address bar link update
                    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?pdf=' + encodeURIComponent(data.url);
                    window.history.pushState({ path: newUrl }, '', newUrl);

                    document.getElementById('upload-card').style.display = 'none';
                    document.getElementById('viewer-section').style.display = 'block';
                    renderPDF(data.url);
                } else {
                    alert("అప్‌లోడ్ విఫలమైంది!");
                }
            } catch (err) {
                alert("సర్వర్ ఎర్రర్ వచ్చింది.");
            } finally {
                statusText.style.display = 'none';
            }
        }

        async function renderPDF(url) {
            const pdf = await pdfjsLib.getDocument(url).promise;
            const container = document.getElementById('pages-container');
            container.innerHTML = '';

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                container.appendChild(canvas);
            }
        }

        function shareWhatsApp() {
            const shareUrl = window.location.href;
            const text = encodeURIComponent("యువగళం ఈ-పేపర్ వార్త చూడండి: " + shareUrl);
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
