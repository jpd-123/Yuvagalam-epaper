<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>యువగళం ఈ-పేపర్ అప్‌లోడ్</title>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .upload-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 500px;
            margin: 20px auto;
        }
        h2 {
            color: #cc0000;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .section-title {
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .input-box {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .divider {
            margin: 15px 0;
            color: #666;
            font-weight: bold;
        }
        .btn-process {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-process:hover {
            background-color: #990000;
        }
        /* Paper Viewer Section */
        #viewer-section {
            display: none;
            margin-top: 20px;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .btn-download {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
        }
        #canvas-container {
            position: relative;
            display: inline-block;
            margin: 10px auto;
            max-width: 100%;
            overflow: auto;
        }
        canvas {
            border: 1px solid #ddd;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Upload Interface -->
    <div class="upload-card" id="upload-card">
        <h2>యువగళం ఈ-పేపర్ అప్‌లోడ్</h2>
        
        <div class="section-title">1. నేరుగా PDF అప్‌లోడ్ చేయండి:</div>
        <input type="file" id="pdf-upload" accept="application/pdf" class="input-box">
        
        <div class="divider">--- లేదా ---</div>
        
        <div class="section-title">2. Google Drive లింక్ ఇవ్వండి:</div>
        <input type="text" id="drive-link" placeholder="https://drive.google.com/file/d/..." class="input-box">
        
        <button class="btn-process" onclick="processEpaper()">ఈ-పేపర్ ప్రాసెస్ చేయండి</button>
    </div>

    <!-- Viewer Section -->
    <div id="viewer-section">
        <div class="controls">
            <button class="btn-action" id="prev-page">గత పేజీ</button>
            <span>పేజీ: <span id="page-num">1</span> / <span id="page-count">0</span></span>
            <button class="btn-action" id="next-page">తర్వాతి పేజీ</button>
            <button class="btn-action btn-download" id="crop-download-btn">వార్తను లోగోతో డౌన్‌లోడ్ చేయండి</button>
        </div>

        <div id="canvas-container">
            <canvas id="pdf-canvas"></canvas>
        </div>
    </div>

    <script>
        let pdfDoc = null, pageNum = 1, scale = 1.5;
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        function processEpaper() {
            const fileInput = document.getElementById('pdf-upload');
            const driveLink = document.getElementById('drive-link').value.trim();

            if (fileInput.files.length > 0) {
                // నేరుగా PDF ఫైల్ ఎంచుకుంటే
                const file = fileInput.files[0];
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    loadPDF(typedarray);
                };
                fileReader.readAsArrayBuffer(file);
            } else if (driveLink !== "") {
                // Google Drive లింక్ ఇస్తే - డైరెక్ట్ డౌన్‌లోడ్ లింక్‌గా మార్చి లోడ్ చేయడం
                let fileId = "";
                const match = driveLink.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    fileId = match[1];
                }

                if (fileId) {
                    const directUrl = `https://docs.google.com/uc?export=download&id=${fileId}`;
                    loadPDFUrl(directUrl);
                } else {
                    alert("చెల్లుబాటు అయ్యే Google Drive లింక్ ఎంటర్ చేయండి!");
                }
            } else {
                alert("దయచేసి ఒక PDF ఫైల్‌ను ఎంచుకోండి లేదా Google Drive లింక్‌ను ఇవ్వండి.");
            }
        }

        function loadPDF(data) {
            pdfjsLib.getDocument(data).promise.then(function(pdf) {
                pdfDoc = pdf;
                document.getElementById('page-count').textContent = pdf.numPages;
                document.getElementById('upload-card').style.display = 'none';
                document.getElementById('viewer-section').style.display = 'block';
                pageNum = 1;
                renderPage(pageNum);
            }).catch(function(error) {
                alert("PDF లోడ్ చేయడంలో విఫలమైంది: " + error.message);
            });
        }

        function loadPDFUrl(url) {
            pdfjsLib.getDocument(url).promise.then(function(pdf) {
                pdfDoc = pdf;
                document.getElementById('page-count').textContent = pdf.numPages;
                document.getElementById('upload-card').style.display = 'none';
                document.getElementById('viewer-section').style.display = 'block';
                pageNum = 1;
                renderPage(pageNum);
            }).catch(function(error) {
                alert("Google Drive నుండి PDF లోడ్ కాలేదు. దయచేసి Drive Link 'Anyone with the link' (పబ్లిక్) గా ఉందో లేదో చూడండి లేదా నేరుగా PDF File అప్‌లోడ్ చేయండి.");
            });
        }

        function renderPage(num) {
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                const renderContext = { canvasContext: ctx, viewport: viewport };
                page.render(renderContext);
                document.getElementById('page-num').textContent = num;
            });
        }

        document.getElementById('prev-page').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            renderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            renderPage(pageNum);
        });

        // వార్తను పైన లోగోతో డౌన్‌లోడ్ చేసే లాజిక్
        document.getElementById('crop-download-btn').addEventListener('click', function() {
            if (!pdfDoc) return;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            const logo = new Image();
            logo.crossOrigin = "Anonymous";
            logo.src = 'logo.png.jpg'; 

            logo.onload = function() {
                const logoHeaderHeight = 110; 
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height + logoHeaderHeight;

                tempCtx.fillStyle = "#ffffff";
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                const logoWidth = Math.min(tempCanvas.width * 0.6, 350);
                const logoHeight = (logo.height / logo.width) * logoWidth;
                const logoX = (tempCanvas.width - logoWidth) / 2;
                tempCtx.drawImage(logo, logoX, 10, logoWidth, logoHeight);

                tempCtx.drawImage(canvas, 0, logoHeaderHeight);

                const link = document.createElement('a');
                link.download = 'Yuvagalam-News-Page.png';
                link.href = tempCanvas.toDataURL('image/png');
                link.click();
            };

            logo.onerror = function() {
                const logoHeaderHeight = 90;
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height + logoHeaderHeight;

                tempCtx.fillStyle = "#ffffff";
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                tempCtx.fillStyle = "#cc0000";
                tempCtx.font = "bold 32px Arial";
                tempCtx.textAlign = "center";
                tempCtx.fillText("యువగళం దినపత్రిక", tempCanvas.width / 2, 55);

                tempCtx.drawImage(canvas, 0, logoHeaderHeight);

                const link = document.createElement('a');
                link.download = 'Yuvagalam-News-Page.png';
                link.href = tempCanvas.toDataURL('image/png');
                link.click();
            };
        });
    </script>
</body>
</html>
